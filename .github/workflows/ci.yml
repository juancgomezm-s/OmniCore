name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows suite has taken about 41 minutes, before setup, SDK/NPM steps and build.
    # The expanded serial suite exceeded 25 minutes on Linux while tests were still passing.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 65 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare Windows AppContainer prerequisites
        if: runner.os == 'Windows'
        run: ./scripts/prepare-windows-ci.ps1 -Action Enable
      - name: Prepare Linux extension isolation prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor build-essential libsecret-1-0 gnome-keyring libsecret-tools dbus
          # Ephemeral CI runner only: permit user namespaces for bwrap, not globally.
          # Product launch still fails closed when the host does not permit isolation.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = '1' ]; then
            sudo install -m 0644 scripts/ci/omnicore-bwrap.apparmor /etc/apparmor.d/bwrap
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-all --unshare-user --disable-userns --new-session --die-with-parent --cap-drop ALL --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore OmniCore.slnx
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Compile and verify the extension SDK before C# process integration tests
        working-directory: sdk/extensions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - run: dotnet build OmniCore.slnx --no-restore
      - name: Build the opt-in agentic evaluation Host driver without model requests
        run: dotnet build tools/evaluation/CoreDriver/CoreDriver.csproj
      - name: Probe the real Windows ConPTY prerequisite before broad regression
        if: runner.os == 'Windows'
        run: ./scripts/probe-windows-conpty-ci.ps1 -Action Probe
      - name: Validate bundled visual report formatter
        run: python -m unittest discover -s tests -p test_visual_explainer_report.py
      - name: Validate regression measurement and comparison receipts
        run: python -m unittest discover -s tests -p "test_regression_*.py"
      - name: Windows crash recovery, Git, isolation and managed-server regression checks
        if: runner.os == 'Windows'
        shell: bash
        run: dotnet test --project tests/OmniCore.Tests/OmniCore.Tests.csproj --no-build --no-restore --parallel none --output Detailed --no-progress --filter 'FullyQualifiedName~WindowsWalRecoveryTests|FullyQualifiedName~Unread_ack_reconnect_lookup_and_unknown_reservation|FullyQualifiedName~Crash_receipt_recovery_stress|FullyQualifiedName~Configured_test_gate_reworks_in_act_loop_when_skill_validator_activation_is_unavailable|FullyQualifiedName~Strong_process_reads_allowed_workspace_but_not_outside_file|FullyQualifiedName~Managed_fixture_accepts_authenticated_readiness|FullyQualifiedName~Managed_local_server_is_launched|FullyQualifiedName~Native_stdio_orq_workflow_publishes_real_owned_implementation_worktree_and_passive_queries_resolve_it|FullyQualifiedName~Two_successive_permission_choices_resume_the_same_run_and_turn_once_each|FullyQualifiedName~Accepted_permission_choice_recovers_from_new_runtime_and_store_after_orderly_cancellation|FullyQualifiedName~Accepted_plan_approval_choice_recovers_from_new_runtime_and_store' < /dev/null
      - name: Verify owned Strong LSP before the broad Linux regression
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/with-linux-secret-service.sh dotnet test --project tests/OmniCore.Tests/OmniCore.Tests.csproj --no-build --no-restore --parallel none --output Detailed --no-progress --filter 'FullyQualifiedName~LanguageServerToolTests' < /dev/null
      - name: All tests, including architecture and process recovery
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Linux' ]; then
            sh scripts/with-linux-secret-service.sh dotnet test --solution OmniCore.slnx --no-build --no-restore --max-parallel-test-modules 1 --parallel none --output Detailed --no-progress < /dev/null
          else
            dotnet test --solution OmniCore.slnx --no-build --no-restore --max-parallel-test-modules 1 --parallel none --output Detailed --no-progress < /dev/null
          fi
      - name: Restore Windows NUL permissions and temp settings
        if: always() && runner.os == 'Windows' && env.OMNICORE_CI_NUL_PREPARED == 'true'
        run: ./scripts/prepare-windows-ci.ps1 -Action Restore
      - name: Preserve the real ConPTY prerequisite evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-conpty-prerequisite
          path: ${{ runner.temp }}/omnicore-conpty-prerequisite/*.log
          if-no-files-found: ignore

  npm-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install, exercise and update the npm application
        shell: bash
        run: |
          npm test
          npm run install:cli -- --prefix "$RUNNER_TEMP/omnicore-npm"
          python scripts/smoke-npm-install.py "$RUNNER_TEMP/omnicore-npm" "$RUNNER_TEMP/npm-smoke"
          npm run install:cli -- --prefix "$RUNNER_TEMP/omnicore-npm"
          python scripts/smoke-npm-install.py "$RUNNER_TEMP/omnicore-npm" "$RUNNER_TEMP/npm-smoke" --after-update

  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang build-essential zlib1g-dev
      - name: Publish and exercise both Linux distributions
        run: bash scripts/validate-linux-package.sh "$RUNNER_TEMP/linux-package"
      - name: Preserve package validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-package-evidence
          path: |
            ${{ runner.temp }}/linux-package/*-publish.log
            ${{ runner.temp }}/linux-package/*-smoke.log
            ${{ runner.temp }}/linux-package/*-terminal.log
            ${{ runner.temp }}/linux-package/*-files.txt
            ${{ runner.temp }}/linux-package/*.sha256
            ${{ runner.temp }}/linux-package/*-smoke/summary.json
            ${{ runner.temp }}/linux-package/*-terminal/*/terminal.ansi
          if-no-files-found: error
