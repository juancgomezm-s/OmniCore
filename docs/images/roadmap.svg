<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">Camino hacia OmniCore v1</title>
  <desc id="desc">M1–M4 base con M2 y M3 de código completo y aceptación pendiente, M5, M5.5 y M6 cerrados en Windows. Planificados: M7 aislamiento, M8 extensibilidad, M9 Host y protocolo, M10 madurez v1. Sin fechas prometidas ni porcentajes de avance.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#F4F7FB}.muted{fill:#AABED0}.cyan{fill:#67D4D0}.purple{fill:#C8A0F5}.h{font-size:23px;font-weight:600}.b{font-size:18px}.s{font-size:16px}.tag{font-size:14px;letter-spacing:1px}</style></defs>
  <rect width="1440" height="660" rx="20" fill="#081C28"/>
  <text x="48" y="50" class="s cyan">ROADMAP / ENTREGA PROGRESIVA</text>
  <text x="48" y="97" font-size="34" font-weight="600">De un Turn fiable a un sistema multiagente verificable.</text>
