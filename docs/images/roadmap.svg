  <g fill="#AABED0"><circle cx="202" cy="410" r="5"/><circle cx="544" cy="410" r="5"/><circle cx="886" cy="410" r="5"/><circle cx="1232" cy="410" r="5"/></g>
  <text x="72" y="223" class="tag cyan">M1–M4 · BASE</text><text x="72" y="260" class="h">Runtime y contexto</text><text x="72" y="296" class="b muted">Journal · tools · TUI</text><text x="72" y="337" class="s muted">M2/M3: aceptación local pendiente</text>
  <text x="414" y="223" class="tag cyan">M5 · CERRADO EN WINDOWS</text><text x="414" y="260" class="h">Modelos y evidencia</text><text x="414" y="296" class="b muted">Local + frontier · quick real</text><text x="414" y="337" class="s muted">Recomendar no amplía permisos</text>
  <text x="756" y="223" class="tag cyan">M5.5 · CERRADO EN WINDOWS</text><text x="756" y="260" class="h">Fronteras pre-M6</text><text x="756" y="296" class="b muted">Identidad · routing · autoridad</text><text x="756" y="337" class="s muted">Contratos listos, sin scheduler</text>
  <text x="1098" y="223" class="tag cyan">M6 · CERRADO EN WINDOWS</text><text x="1098" y="260" class="h">Coordinar agentes</text><text x="1098" y="296" class="b muted">Scheduler · joins · supervisión</text><text x="1098" y="337" class="s muted">Lecturas en paralelo · un Host</text>
  <text x="72" y="463" class="tag muted">M7 · PLANIFICADO</text><text x="72" y="500" class="h">Aislar e integrar</text><text x="72" y="536" class="b muted">Worktrees · reconciliación</text><text x="72" y="572" class="s muted">Undo respetando cambios ajenos</text>
